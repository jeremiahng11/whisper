<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisper Minutes</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:#e3e1dc;--accent:#2f6f5e;--accent-ink:#fff;--warn:#b3261e;--chip:#eeece7}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#ececec;--mute:#9a9a9a;--line:#2e2e2e;--accent:#5fb39a;--accent-ink:#0d1f1a;--warn:#ff8a80;--chip:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 20px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=password],input[type=text],select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
input[type=password]{flex:1;min-width:200px}
button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
button.danger{background:transparent;color:var(--warn);border:1px solid var(--line);font-weight:500}
button:disabled{opacity:.5;cursor:default}
#drop{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--mute);cursor:pointer;margin-bottom:12px}
#drop.over{border-color:var(--accent);color:var(--ink)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:500}
tr.job{cursor:pointer}
tr.job:hover td{background:var(--chip)}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--chip);font-size:12px}
.chip.done{background:var(--accent);color:var(--accent-ink)}
.chip.error{background:var(--warn);color:#fff}
.mute{color:var(--mute);font-size:12px}
#view h1,#view h2,#view h3{margin:18px 0 6px}
#view h1{font-size:20px}#view h2{font-size:17px}#view h3{font-size:15px}
#view code{background:var(--chip);padding:0 4px;border-radius:4px;font-size:12px}
#view ul{padding-left:20px;margin:4px 0}
#view blockquote{margin:6px 0;padding:4px 10px;border-left:3px solid var(--warn);color:var(--mute)}
.hidden{display:none}
@media (max-width:640px){.hide-sm{display:none}}
</style>
</head>
<body>
<main>
  <h1>Whisper Minutes</h1>
  <p class="sub">Self-hosted transcription and meeting summaries. Recordings stay on this server.</p>

  <div class="card row">
    <input id="key" type="password" placeholder="API key" autocomplete="off">
    <button class="ghost" id="saveKey">Save key</button>
    <span id="health" class="mute"></span>
  </div>

  <div class="card">
    <div id="drop">Drop an audio file here or click to choose (wav, mp3, m4a, ogg, webm, flac…)</div>
    <input id="file" type="file" accept="audio/*,video/*" class="hidden">
    <div class="row">
      <label class="mute">Language
        <select id="lang">
          <option value="">Auto-detect</option><option value="en">English</option><option value="zh">Chinese</option>
          <option value="ms">Malay</option><option value="ta">Tamil</option><option value="id">Indonesian</option>
          <option value="ja">Japanese</option><option value="ko">Korean</option><option value="th">Thai</option>
          <option value="vi">Vietnamese</option>
        </select></label>
      <label class="mute"><input type="checkbox" id="sum" checked> Summary</label>
      <label class="mute"><input type="checkbox" id="diar"> Speaker labels</label>
      <input id="title" type="text" placeholder="Title (optional)">
    </div>
    <div id="up" class="hidden"><div class="mute" id="upText"></div><div class="bar"><i id="upBar"></i></div></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between"><strong>Recordings</strong><button class="ghost" id="refresh">Refresh</button></div>
    <table><thead><tr><th>Recording</th><th class="hide-sm">Length</th><th>Status</th><th class="hide-sm">Added</th></tr></thead>
      <tbody id="jobs"></tbody></table>
  </div>

  <div class="card hidden" id="viewCard">
    <div class="row" style="justify-content:space-between">
      <div class="row" id="dl"></div>
      <div class="row"><button class="ghost" id="resum">Redo summary</button><button class="danger" id="del">Delete</button></div>
    </div>
    <div id="view"></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
let KEY = ""; try { KEY = localStorage.getItem("whisperKey") || ""; } catch (e) {}
$("#key").value = KEY;
let current = null;

function hdr() { return { "Authorization": "Bearer " + KEY }; }
async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: { ...hdr(), ...(opt.headers || {}) } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r;
}
$("#saveKey").onclick = () => { KEY = $("#key").value.trim(); try { localStorage.setItem("whisperKey", KEY); } catch (e) {} load(); };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dur = s => !s ? "" : s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.round(s % 3600 / 60)}m` : s >= 60 ? `${Math.round(s / 60)} min` : `${Math.round(s)} s`;
const when = t => new Date(t * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });

async function health() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("#health").textContent = `${h.model}${h.model_loaded ? "" : " (loading…)"} · summary: ${h.summary_backend === "none" ? "off" : h.summary_model}`;
  } catch (e) { $("#health").textContent = "server not reachable"; }
}

function status(j) {
  if (j.status === "queued") return `<span class="chip">queued${j.queue_position > 1 ? " #" + j.queue_position : ""}</span>`;
  if (j.status === "transcribing" || j.status === "summarizing")
    return `<span class="chip">${esc(j.stage || j.status)} ${Math.round(j.progress * 100)}%</span>`;
  if (j.status === "error") return `<span class="chip error" title="${esc(j.error)}">error</span>`;
  return `<span class="chip done">done</span>${j.summary_error ? ' <span class="mute">no summary</span>' : ""}`;
}

async function load() {
  if (!KEY) { $("#jobs").innerHTML = `<tr><td colspan="4" class="mute">Enter the API key above.</td></tr>`; return; }
  try {
    const jobs = await (await api("/api/jobs?limit=100")).json();
    $("#jobs").innerHTML = jobs.length ? jobs.map(j => `<tr class="job" data-id="${j.id}">
      <td><div>${esc(j.title || j.filename)}</div>${j.title ? `<div class="mute">${esc(j.filename)}</div>` : ""}</td>
      <td class="hide-sm">${dur(j.duration)}</td><td>${status(j)}</td><td class="hide-sm mute">${when(j.created_at)}</td></tr>`).join("")
      : `<tr><td colspan="4" class="mute">No recordings yet.</td></tr>`;
    document.querySelectorAll("tr.job").forEach(tr => tr.onclick = () => show(tr.dataset.id));
  } catch (e) { $("#jobs").innerHTML = `<tr><td colspan="4" class="mute">${esc(e.message)}</td></tr>`; }
}

function md(src) {   // tiny Markdown renderer: headings, lists, checkboxes, bold, italics, code, quotes
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*]+)\*(?=\W|$)/g, "$1<em>$2</em>");
  let out = "", list = false;
  for (const line of src.split("\n")) {
    const li = line.match(/^\s*[-*] (\[[ x]\] )?(.*)/);
    if (li) { if (!list) { out += "<ul>"; list = true; } out += `<li>${li[1] ? (li[1].includes("x") ? "☑ " : "☐ ") : ""}${inline(li[2])}</li>`; continue; }
    if (list) { out += "</ul>"; list = false; }
    const h = line.match(/^(#{1,3}) (.*)/);
    if (h) out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if (line.startsWith("> ")) out += `<blockquote>${inline(line.slice(2))}</blockquote>`;
    else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  return out + (list ? "</ul>" : "");
}

async function show(id) {
  current = id;
  const j = await (await api(`/api/jobs/${id}`)).json();
  $("#viewCard").classList.remove("hidden");
  $("#resum").disabled = j.status !== "done";
  if (j.status !== "done") {
    $("#dl").innerHTML = "";
    $("#view").innerHTML = j.status === "error" ? `<p><strong>Failed:</strong> ${esc(j.error)}</p><button id="retry">Retry</button>`
      : `<p class="mute">${esc(j.stage || j.status)} – results appear here when it's done.</p>`;
    if ($("#retry")) $("#retry").onclick = async () => { await api(`/api/jobs/${id}/retry`, { method: "POST" }); load(); show(id); };
  } else {
    const text = await (await api(j.results.markdown)).text();
    $("#view").innerHTML = md(text);
    $("#dl").innerHTML = [["markdown", "Minutes .md"], ["text", "Transcript .txt"], ["srt", "Subtitles .srt"]]
      .map(([k, label]) => `<button class="ghost" data-u="${j.results[k]}">${label}</button>`).join("");
    document.querySelectorAll("#dl button").forEach(b => b.onclick = () => download(b.dataset.u));
  }
  $("#viewCard").scrollIntoView({ behavior: "smooth" });
}

async function download(url) {
  const r = await api(url);
  const name = (r.headers.get("content-disposition") || "").match(/filename="?([^";]+)"?/)?.[1] || "result";
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await r.blob()), download: decodeURIComponent(name) });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

$("#del").onclick = async () => {
  if (!current) return;
  try { await api(`/api/jobs/${current}`, { method: "DELETE" }); } catch (e) { $("#view").innerHTML = `<p>${esc(e.message)}</p>`; return; }
  $("#viewCard").classList.add("hidden"); current = null; load();
};
$("#resum").onclick = async () => { if (current) { await api(`/api/jobs/${current}/summarize`, { method: "POST" }); load(); show(current); } };
$("#refresh").onclick = load;

function upload(file) {
  if (!KEY) { alertBox("Enter the API key first."); return; }
  const q = new URLSearchParams({ summarize: $("#sum").checked, diarize: $("#diar").checked });
  if ($("#lang").value) q.set("language", $("#lang").value);
  if ($("#title").value.trim()) q.set("title", $("#title").value.trim());
  const x = new XMLHttpRequest();
  x.open("POST", "/api/jobs?" + q);
  x.setRequestHeader("Authorization", "Bearer " + KEY);
  x.setRequestHeader("X-Filename", file.name);
  x.setRequestHeader("Content-Type", file.type || "application/octet-stream");
  $("#up").classList.remove("hidden");
  x.upload.onprogress = e => { if (e.lengthComputable) { $("#upBar").style.width = (e.loaded / e.total * 100) + "%"; $("#upText").textContent = `Uploading ${file.name}… ${Math.round(e.loaded / e.total * 100)}%`; } };
  x.onload = () => { $("#upText").textContent = x.status < 300 ? `${file.name} uploaded – queued.` : `Upload failed: ${x.responseText}`; $("#title").value = ""; load(); };
  x.onerror = () => { $("#upText").textContent = "Upload failed (network)."; };
  x.send(file);
}
function alertBox(msg) { $("#up").classList.remove("hidden"); $("#upText").textContent = msg; }
$("#drop").onclick = () => $("#file").click();
$("#file").onchange = e => { for (const f of e.target.files) upload(f); e.target.value = ""; };
["dragenter", "dragover"].forEach(ev => $("#drop").addEventListener(ev, e => { e.preventDefault(); $("#drop").classList.add("over"); }));
["dragleave", "drop"].forEach(ev => $("#drop").addEventListener(ev, e => { e.preventDefault(); $("#drop").classList.remove("over"); }));
$("#drop").addEventListener("drop", e => { for (const f of e.dataTransfer.files) upload(f); });

health(); load();
setInterval(() => { load(); health(); }, 4000);
</script>
</body>
</html>
